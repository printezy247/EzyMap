<svg width="100%" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientZones" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="gradientSignals" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#gradientBg)"/>
  
  <!-- Market Chart Background -->
  <rect x="50" y="50" width="1100" height="300" fill="rgba(255,255,255,0.05)" stroke="#334155" stroke-width="2" rx="10"/>
  
  <!-- Grid Lines -->
  <g stroke="#475569" stroke-width="1" stroke-dasharray="5,5">
    <line x1="50" y1="50" x2="50" y2="350"/>
    <line x1="50" y1="350" x2="1150" y2="350"/>
    <line x1="150" y1="50" x2="150" y2="350"/>
    <line x1="250" y1="50" x2="250" y2="350"/>
    <line x1="350" y1="50" x2="350" y2="350"/>
    <line x1="450" y1="50" x2="450" y2="350"/>
    <line x1="550" y1="50" x2="550" y2="350"/>
    <line x1="650" y1="50" x2="650" y2="350"/>
    <line x1="750" y1="50" x2="750" y2="350"/>
    <line x1="850" y1="50" x2="850" y2="350"/>
    <line x1="950" y1="50" x2="950" y2="350"/>
    <line x1="1050" y1="50" x2="1050" y2="350"/>
  </g>
  
  <!-- Support Zone (R1) -->
  <rect x="150" y="250" width="100" height="50" rx="5" fill="url(#gradientZones)" opacity="0.7"/>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">R1</text>
  
  <!-- Resistance Zone (S2) -->
  <rect x="350" y="200" width="100" height="100" rx="5" fill="url(#gradientSignals)" opacity="0.7"/>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">S2</text>
  
  <!-- Support Zone (R2) -->
  <rect x="550" y="220" width="100" height="80" rx="5" fill="url(#gradientZones)" opacity="0.7"/>
  <text x="600" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">R2</text>
  
  <!-- Price Line -->
  <path d="M80 320 L200 280 L350 320 L550 240 L750 320 L950 280 L1100 320" stroke="#3b82f6" stroke-width="3" fill="none"/>
  
  <!-- Live Signal Marker -->
  <circle cx="750" cy="180" r="15" fill="#ef4444" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="750" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">BUY</text>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">EzyMap Live Signal</text>
  
  <!-- Subtitle -->
  <text x="600" y="90" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#94a3b8">AI-Powered Trading for XAU/BTC</text>
</svg>