<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientBitcoin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="500" fill="url(#gradientDark)"/>
  
  <!-- Main Zone Diagram -->
  <g transform="translate(100, 50)">
    <!-- Grid Background -->
    <rect width="1000" height="400" rx="20" fill="rgba(255,255,255,0.05)" stroke="#374151" stroke-width="2"/>
    
    <!-- Zone Labels -->
    <text x="500" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#fbbf24">EzyMap Zone Construction</text>
    
    <!-- R2 (Highest Support) -->
    <rect x="100" y="200" width="150" height="60" rx="8" fill="url(#gradientGold)" opacity="0.9"/>
    <rect x="100" y="200" width="150" height="60" rx="8" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="175" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">R2</text>
    <text x="175" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fbbf24">Highest Support</text>
    
    <!-- R1 (High Support) -->
    <rect x="300" y="180" width="150" height="80" rx="8" fill="url(#gradientGold)" opacity="0.8"/>
    <rect x="300" y="180" width="150" height="80" rx="8" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="375" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">R1</text>
    <text x="375" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fbbf24">High Support</text>
    
    <!-- S1 (Low Resistance) -->
    <rect x="500" y="150" width="150" height="100" rx="8" fill="url(#gradientSilver)" opacity="0.9"/>
    <rect x="500" y="150" width="150" height="100" rx="8" fill="none" stroke="#e5e7eb" stroke-width="2"/>
    <text x="575" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">S1</text>
    <text x="575" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e5e7eb">Low Resistance</text>
    
    <!-- S2 (High Resistance) -->
    <rect x="700" y="120" width="150" height="130" rx="8" fill="url(#gradientBitcoin)" opacity="0.9"/>
    <rect x="700" y="120" width="150" height="130" rx="8" fill="none" stroke="#f7931a" stroke-width="3"/>
    <text x="775" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">S2</text>
    <text x="775" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fbbf24">High Resistance</text>
    
    <!-- Zone Connection Lines -->
    <line x1="250" y1="230" x2="400" y2="220" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="450" y1="230" x2="600" y2="160" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="650" y1="160" x2="800" y2="125" stroke="#f7931a" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Market Range -->
    <line x1="100" y1="320" x2="900" y2="320" stroke="#ef4444" stroke-width="2" stroke-dasharray="10,5"/>
    <text x="500" y="340" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#ef4444">Price Range: $1,000 - $2,000</text>
    
    <!-- Legend -->
    <rect x="950" y="150" width="200" height="200" rx="10" fill="rgba(0,0,0,0.7)" stroke="#4b5563" stroke-width="2"/>
    <text x="1050" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Zone Legend</text>
    
    <!-- FVG Indicator -->
    <rect x="970" y="220" width="160" height="40" rx="5" fill="rgba(79, 209, 197, 0.2)" stroke="#4fd1c5" stroke-width="2"/>
    <text x="1000" y="245" font-family="Arial, sans-serif" font-size="14" fill="white">Fair Value Gap (FVG)</text>
    <text x="1050" y="270" font-family="Arial, sans-serif" font-size="12" fill="#4fd1c5">💡 Confirmation Type</text>
    
    <!-- CHOCH Indicator -->
    <rect x="970" y="280" width="160" height="40" rx="5" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="1000" y="305" font-family="Arial, sans-serif" font-size="14" fill="white">Zone-anchored</text>
    <text x="1050" y="325" font-family="Arial, sans-serif" font-size="12" fill="#8b5cf6">CHOCH Confirmation</text>
  </g>
</svg>